# Weekly update PRs for npm dependencies and pinned GitHub Actions.
# Security updates are not affected by these rules: Dependabot still opens a PR
# as soon as an advisory affects the lockfile.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Same 14-day maturity rule as pnpm's minimumReleaseAge, so local installs
    # never reject a version Dependabot already locked.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions of the framework, compiler and ORM are migrations done on
    # purpose (all related packages together), not weekly bumps.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/*"
        update-types: [version-update:semver-major]
      # Types must describe the Node that runs the code (see engines), not a newer one.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
